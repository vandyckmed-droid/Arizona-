<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Cross-Asset Momentum</title>
<style>
  :root{
    --bg:#fbfbfa; --card:#fff; --ink:#16150f; --muted:#7a776c; --line:#e6e4dd;
    --pos:#1f7a4d; --neg:#b23c2b; --accent:#3b5bdb; --chip:#f0efe9;
  }
  @media (prefers-color-scheme:dark){
    :root{ --bg:#141412; --card:#1c1c19; --ink:#eceae2; --muted:#918d80; --line:#2c2b26;
           --pos:#5fbf8a; --neg:#e07a63; --accent:#8fa4f5; --chip:#26251f; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    -webkit-text-size-adjust:100%}
  .wrap{max-width:760px;margin:0 auto;padding:0 12px calc(28px + env(safe-area-inset-bottom))}

  header{padding:18px 2px 10px}
  h1{margin:0;font-size:18px;letter-spacing:-.01em}
  .sub{color:var(--muted);font-size:12px;margin-top:3px}
  .stats{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .stat{background:var(--chip);border-radius:7px;padding:5px 8px;font-size:11px;color:var(--muted)}
  .stat b{color:var(--ink);font-weight:600}

  .tabs{display:flex;gap:6px;margin:12px 0 8px}
  .tab{flex:1;padding:8px;border:1px solid var(--line);background:var(--card);color:var(--muted);
    border-radius:9px;font:inherit;font-size:13px;cursor:pointer}
  .tab[aria-selected=true]{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}

  .controls{position:sticky;top:0;z-index:5;background:var(--bg);padding:6px 0 8px}
  input[type=search]{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;
    background:var(--card);color:var(--ink);font:inherit;font-size:16px}
  .chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;padding:5px 10px;border:1px solid var(--line);border-radius:999px;
    background:var(--card);color:var(--muted);font:inherit;font-size:12px;cursor:pointer;white-space:nowrap}
  .chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

  ol{list-style:none;margin:0;padding:0}
  li.row{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:6px}
  .head{display:grid;grid-template-columns:30px 1fr auto;gap:9px;align-items:center;
    padding:10px 11px;cursor:pointer}
  .rank{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums;text-align:right}
  .id{min-width:0}
  .tk{font-weight:650;letter-spacing:-.01em}
  .tk .dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--muted);
    opacity:.55;margin-left:5px;vertical-align:middle}
  .nm{color:var(--muted);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cat{color:var(--muted);font-size:10.5px;margin-top:2px}
  .nums{text-align:right;font-variant-numeric:tabular-nums}
  .blend{font-weight:650;font-size:15px}
  .parts{color:var(--muted);font-size:10.5px;margin-top:1px}
  .pos{color:var(--pos)} .neg{color:var(--neg)}

  .detail{border-top:1px solid var(--line);padding:10px 11px;font-size:12.5px}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px 14px;margin-bottom:9px}
  .kv{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dotted var(--line);padding-bottom:3px}
  .kv span:first-child{color:var(--muted)}
  .kv span:last-child{font-variant-numeric:tabular-nums}
  .peers{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
  .peer{background:var(--chip);border-radius:6px;padding:3px 7px;font-size:11.5px;font-variant-numeric:tabular-nums}
  .lbl{color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;margin:9px 0 2px}
  .note{color:var(--muted);font-size:11.5px;margin-top:6px}

  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px;margin-bottom:6px}
  .card h3{margin:0 0 5px;font-size:13px;font-weight:650}
  .card .meta{color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
  .members{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
  .dupes{font-size:12.5px}
  .dupe{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
  .dupe:last-child{border-bottom:0}
  .empty{color:var(--muted);text-align:center;padding:28px 0;font-size:13px}
  footer{color:var(--muted);font-size:11px;line-height:1.6;padding:16px 2px 0;border-top:1px solid var(--line);margin-top:16px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Cross-Asset Momentum</h1>
    <div class="sub" id="sub">loading…</div>
    <div class="stats" id="stats"></div>
  </header>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="t-rank" aria-selected="true">Ranking</button>
    <button class="tab" role="tab" id="t-group" aria-selected="false">Same-bet groups</button>
  </div>

  <section id="view-rank">
    <div class="controls">
      <input type="search" id="q" placeholder="Search ticker, name or exposure" autocomplete="off">
      <div class="chips" id="chips"></div>
    </div>
    <ol id="list"></ol>
  </section>

  <section id="view-group" hidden></section>

  <footer id="foot"></footer>
</div>

<script>
const $ = s => document.querySelector(s);
const pct = x => (x*100).toFixed(1) + '%';
const sgn = x => (x >= 0 ? '+' : '') + x.toFixed(2);
const cls = x => x >= 0 ? 'pos' : 'neg';
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

let DATA, cat = 'All', open = null;

fetch('data.json').then(r => r.json()).then(d => { DATA = d; init(); })
  .catch(() => { $('#sub').textContent = 'Could not load data.json — serve this folder over HTTP.'; });

function init(){
  const m = DATA.meta;
  $('#sub').textContent = `${m.ranked} instruments · through ${m.last_session}`;
  $('#stats').innerHTML = [
    ['ranked', m.ranked],
    ['full 756d corr', m.correlation_eligible],
    ['groups', DATA.clusters.length],
    ['near-dupe pairs', DATA.duplicates.length],
  ].map(([k,v]) => `<div class="stat"><b>${v}</b> ${k}</div>`).join('');

  const cats = ['All', ...Object.keys(m.category_mix).sort((a,b) => m.category_mix[b]-m.category_mix[a])];
  $('#chips').innerHTML = cats.map(c =>
    `<button class="chip" data-c="${esc(c)}" aria-pressed="${c==='All'}">${esc(c)}${
      c==='All' ? '' : ' <span style="opacity:.6">'+m.category_mix[c]+'</span>'}</button>`).join('');
  $('#chips').onclick = e => {
    const b = e.target.closest('.chip'); if (!b) return;
    cat = b.dataset.c;
    document.querySelectorAll('.chip').forEach(x => x.setAttribute('aria-pressed', x === b));
    render();
  };
  $('#q').oninput = render;

  $('#t-rank').onclick = () => tab(true);
  $('#t-group').onclick = () => tab(false);

  $('#foot').innerHTML =
    `12&#8211;1 = return over sessions ${m.min_rank_sessions-1}&#8594;21 back divided by realized daily vol of the same window; `
    + `6&#8211;1 is the 126&#8594;21 equivalent. Both are z-scored across the ranked universe and blended 50/50. `
    + `Correlation is Pearson on raw daily returns over ${m.correlation_returns} returns spanning `
    + `${m.correlation_sessions} aligned sessions (${m.correlation_window[0]} to ${m.correlation_window[1]}); `
    + `groups are average-linkage at &rho;&nbsp;&ge;&nbsp;${m.cluster_threshold}, near-duplicates are pairs at &rho;&nbsp;&ge;&nbsp;${m.duplicate_threshold}. `
    + `A <span class="dot" style="display:inline-block;width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.55"></span> `
    + `marks an instrument without the full ${m.correlation_sessions}-session history. `
    + `Prices: ${esc(m.price_source)}, generated ${esc(m.generated_at)}. Not investment advice.`;

  renderGroups();
  render();
}

function tab(showRank){
  $('#t-rank').setAttribute('aria-selected', showRank);
  $('#t-group').setAttribute('aria-selected', !showRank);
  $('#view-rank').hidden = !showRank;
  $('#view-group').hidden = showRank;
  window.scrollTo(0, 0);
}

function render(){
  const q = $('#q').value.trim().toLowerCase();
  const rows = DATA.rows.filter(r =>
    (cat === 'All' || r.category === cat) &&
    (!q || r.ticker.toLowerCase().includes(q) || r.name.toLowerCase().includes(q)
        || r.exposure.toLowerCase().includes(q)));

  $('#list').innerHTML = rows.length
    ? rows.map(card).join('')
    : '<div class="empty">Nothing matches.</div>';

  $('#list').onclick = e => {
    const h = e.target.closest('.head'); if (!h) return;
    const t = h.parentElement.dataset.t;
    open = (open === t) ? null : t;
    render();
  };
}

function card(r){
  return `<li class="row" data-t="${r.ticker}">
    <div class="head">
      <div class="rank">${r.rank}</div>
      <div class="id">
        <div class="tk">${r.ticker}${r.corr_ok ? '' : '<span class="dot" title="short history"></span>'}</div>
        <div class="nm">${esc(r.name)}</div>
        <div class="cat">${esc(r.category)} &middot; ${esc(r.exposure)}</div>
      </div>
      <div class="nums">
        <div class="blend ${cls(r.blend)}">${sgn(r.blend)}</div>
        <div class="parts">12&#8211;1 <span class="${cls(r.z12)}">${sgn(r.z12)}</span>
          &nbsp; 6&#8211;1 <span class="${cls(r.z6)}">${sgn(r.z6)}</span></div>
      </div>
    </div>
    ${open === r.ticker ? detail(r) : ''}
  </li>`;
}

function detail(r){
  const kv = (k, v, c) => `<div class="kv"><span>${k}</span><span class="${c||''}">${v}</span></div>`;
  const peers = r.corr_ok && r.peers.length
    ? `<div class="lbl">Closest peers &middot; 756-session &rho;</div>
       <div class="peers">${r.peers.map(p =>
          `<span class="peer">${p.ticker} <b>${p.corr.toFixed(2)}</b></span>`).join('')}</div>
       <div class="peers"><span class="peer" style="opacity:.7">most negative: ${
          r.opposite.ticker} <b>${r.opposite.corr.toFixed(2)}</b></span></div>`
    : `<div class="note">Only ${r.sessions} sessions of history — ranked, but not in the
       ${DATA.meta.correlation_sessions}-session correlation matrix.</div>`;
  const grp = r.cluster
    ? (() => { const c = DATA.clusters.find(x => x.id === r.cluster);
        return `<div class="lbl">Same-bet group</div>
          <div class="peers">${c.members.map(m =>
            `<span class="peer"${m===r.ticker?' style="font-weight:700"':''}>${m}</span>`).join('')}</div>
          <div class="note">avg &rho; ${c.avg_corr.toFixed(3)} &middot; min &rho; ${c.min_corr.toFixed(3)}</div>`;
      })()
    : (r.corr_ok ? '<div class="note">No group at &rho; &ge; ' + DATA.meta.cluster_threshold + ' — stands alone.</div>' : '');

  return `<div class="detail">
    <div class="grid">
      ${kv('12&#8211;1 return', pct(r.ret12), cls(r.ret12))}
      ${kv('6&#8211;1 return', pct(r.ret6), cls(r.ret6))}
      ${kv('12&#8211;1 daily vol', pct(r.vol12))}
      ${kv('6&#8211;1 daily vol', pct(r.vol6))}
      ${kv('12&#8211;1 score', r.score12.toFixed(2))}
      ${kv('6&#8211;1 score', r.score6.toFixed(2))}
      ${kv('structure', esc(r.structure))}
      ${kv('sessions', r.sessions)}
    </div>
    ${peers}
    ${grp}
  </div>`;
}

function renderGroups(){
  const m = DATA.meta;
  $('#view-group').innerHTML =
    `<div class="note" style="padding:4px 2px 10px">Groups of correlation-eligible instruments whose
       average-linkage correlation stays at or above ${m.cluster_threshold} over
       ${m.correlation_returns} daily returns. Nothing is removed or merged — this is for inspection.</div>`
    + DATA.clusters.map(c => `<div class="card">
        <h3>${c.size} instruments</h3>
        <div class="meta">avg &rho; ${c.avg_corr.toFixed(3)} &middot; min &rho; ${c.min_corr.toFixed(3)}</div>
        <div class="members">${c.members.map(t => {
          const r = DATA.rows.find(x => x.ticker === t);
          return `<span class="peer">${t} <span style="opacity:.6">#${r.rank}</span></span>`;
        }).join('')}</div>
      </div>`).join('')
    + `<div class="card"><h3>Near-duplicate pairs &middot; &rho; &ge; ${m.duplicate_threshold}</h3>
        <div class="meta">${DATA.duplicates.length} pairs</div>
        <div class="dupes" style="margin-top:7px">${DATA.duplicates.map(d =>
          `<div class="dupe"><span>${d.a} &nbsp;/&nbsp; ${d.b}</span><span>${d.corr.toFixed(4)}</span></div>`
        ).join('')}</div></div>`;
}
</script>
</body>
</html>
