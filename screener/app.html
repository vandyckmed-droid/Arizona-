<title>Cross-Asset Momentum Screen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  :root{
    --bg:#f2f5f6; --card:#fff; --sunk:#e9eef0; --hatch:#c3ced3;
    --ink:#10161c; --mid:#48575f; --muted:#77878f; --line:#dbe3e6;
    --pos:#0f766e; --neg:#b4451f;
    --accent:#2a78d6; --accent-soft:#e2edfa;
    --band12:#e4ebee; --band9:#dbe5e9; --band6:#d3dee3;
    --sans:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    --disp:"Archivo","IBM Plex Sans",-apple-system,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#0d1215; --card:#161d21; --sunk:#1d262a; --hatch:#3a474d;
      --ink:#e7edef; --mid:#a9b7bd; --muted:#7f8f97; --line:#252f34;
      --pos:#4bbfa8; --neg:#e08159;
      --accent:#3987e5; --accent-soft:#1b2f45;
      --band12:#1f292e; --band9:#242f34; --band6:#293539;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0d1215; --card:#161d21; --sunk:#1d262a; --hatch:#3a474d;
    --ink:#e7edef; --mid:#a9b7bd; --muted:#7f8f97; --line:#252f34;
    --pos:#4bbfa8; --neg:#e08159;
    --accent:#3987e5; --accent-soft:#1b2f45;
    --band12:#1f292e; --band9:#242f34; --band6:#293539;
  }

  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
    font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
  .wrap{max-width:780px;margin:0 auto;padding:0 14px calc(32px + env(safe-area-inset-bottom))}
  .num{font-family:var(--mono);font-variant-numeric:tabular-nums}
  button{font-family:inherit;color:inherit}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
  [hidden]{display:none!important}

  /* ---- masthead ---- */
  header{padding:26px 0 14px;border-bottom:1.5px solid var(--ink)}
  .eyebrow{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
    font-weight:500;margin-bottom:7px}
  h1{margin:0;font-family:var(--disp);font-size:26px;font-weight:700;letter-spacing:-.022em;
    line-height:1.1;text-wrap:balance}
  .asof{margin-top:6px;font-size:12.5px;color:var(--mid)}
  .asof b{font-family:var(--mono);font-weight:500;color:var(--ink)}
  .tally{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);
    border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-top:16px}
  .tally div{background:var(--card);padding:9px 8px}
  .tally .v{font-family:var(--mono);font-size:19px;font-weight:600;line-height:1.15;letter-spacing:-.02em}
  .tally .k{font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);
    margin-top:3px;white-space:nowrap}
  .caveat{margin-top:12px;padding:10px 12px;background:var(--sunk);border-radius:8px;
    font-size:12px;line-height:1.5;color:var(--mid)}
  .caveat b{color:var(--ink);font-weight:600}

  /* ---- tabs ---- */
  .tabs{display:flex;gap:2px;margin:18px 0 0;background:var(--sunk);padding:3px;border-radius:9px}
  .tab{flex:1;padding:8px 6px;border:0;background:none;color:var(--mid);border-radius:7px;
    font-size:13px;font-weight:500;cursor:pointer}
  .tab[aria-selected="true"]{background:var(--card);color:var(--ink);font-weight:600;
    box-shadow:0 1px 2px rgba(0,0,0,.09)}
  .tab .badge{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-left:4px}
  .tab[aria-selected="true"] .badge{color:var(--accent)}

  /* ---- ranking config ---- */
  .config{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;
    padding:12px 0 2px;border-bottom:1px solid var(--line)}
  .cfg{display:flex;align-items:center;gap:7px}
  .cfg > span{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--muted);font-weight:500}
  .seg{display:flex;background:var(--sunk);border-radius:7px;padding:2px;gap:2px}
  .seg button{border:0;background:none;color:var(--mid);border-radius:5px;
    padding:5px 9px;font-size:12px;cursor:pointer;white-space:nowrap}
  .seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);font-weight:600;
    box-shadow:0 1px 2px rgba(0,0,0,.09)}
  .seg.win button[aria-pressed="true"]{background:var(--accent);color:#fff}
  .seg.win button{font-family:var(--mono);font-size:11.5px}
  .cfg-note{flex-basis:100%;font-size:11px;color:var(--muted);line-height:1.5;padding-bottom:10px}

  /* ---- window table (ticker view) ---- */
  .wt-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
  table.wt{border-collapse:collapse;width:100%;min-width:290px;font-size:12.5px}
  table.wt th{font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);
    font-weight:500;text-align:right;padding:0 0 5px 10px;white-space:nowrap}
  table.wt th:first-child{text-align:left;padding-left:0}
  table.wt td{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;
    padding:6px 0 6px 10px;border-top:1px solid var(--line);white-space:nowrap}
  table.wt td:first-child{text-align:left;padding-left:0;font-family:var(--sans);color:var(--mid)}
  table.wt tr.off td{opacity:.42}
  table.wt tr.on td:first-child{color:var(--ink);font-weight:600}

  /* ---- filters ---- */
  .controls{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 8px}
  input[type="search"]{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;
    background:var(--card);color:var(--ink);font-family:var(--sans);font-size:16px;-webkit-appearance:none}
  input[type="search"]::placeholder{color:var(--muted)}
  .chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:5px 11px;
    border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--mid);
    font-size:12px;cursor:pointer;white-space:nowrap}
  .chip .n{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
  .chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:500}
  .chip[aria-pressed="true"] .n{color:var(--bg);opacity:.65}
  .chip.star[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
  .chip.star[aria-pressed="true"] .n{color:#fff}

  /* ---- list rows ---- */
  ol{list-style:none;margin:0;padding:0}
  li.row{background:var(--card);border:1px solid var(--line);border-radius:9px;margin-bottom:5px;
    display:grid;grid-template-columns:1fr 38px;align-items:stretch;overflow:hidden}
  .open{display:grid;grid-template-columns:24px 1fr auto;gap:10px;align-items:center;
    padding:10px 4px 10px 12px;cursor:pointer;border:0;background:none;text-align:left;
    font:inherit;color:inherit;min-width:0}
  .rank{font-family:var(--mono);font-size:12px;color:var(--muted);text-align:right}
  .id{min-width:0;display:block}
  .tk{display:block;font-family:var(--disp);font-weight:700;font-size:15px;letter-spacing:-.012em}
  .tk .short{display:inline-block;width:4px;height:4px;border-radius:50%;background:var(--muted);
    margin-left:6px;vertical-align:middle}
  .nm{display:block;color:var(--mid);font-size:11.5px;margin-top:1px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .exp{display:block;color:var(--muted);font-size:10.5px;margin-top:1px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .nums{text-align:right;display:block}
  .blend{display:block;font-family:var(--mono);font-size:16px;font-weight:600;letter-spacing:-.02em}
  .parts{display:block;font-family:var(--mono);font-size:10px;color:var(--muted);
    margin-top:2px;white-space:nowrap}
  .pos{color:var(--pos)} .neg{color:var(--neg)}

  .star-btn{border:0;border-left:1px solid var(--line);background:none;cursor:pointer;
    display:flex;align-items:center;justify-content:center;padding:0;color:var(--muted)}
  .star-btn:hover{background:var(--sunk)}
  .star-btn[aria-pressed="true"]{color:var(--accent)}
  .star-btn svg{width:17px;height:17px;display:block}

  /* ---- ticker view ---- */
  .back{display:inline-flex;align-items:center;gap:6px;border:0;background:none;color:var(--mid);
    font-size:13px;cursor:pointer;padding:14px 4px 10px;margin-left:-4px}
  .tv-head{display:flex;align-items:flex-start;gap:12px;justify-content:space-between}
  .tv-title{min-width:0}
  .tv-tk{font-family:var(--disp);font-size:30px;font-weight:700;letter-spacing:-.025em;line-height:1}
  .tv-nm{color:var(--mid);font-size:13px;margin-top:5px}
  .tv-meta{color:var(--muted);font-size:11.5px;margin-top:3px}
  .tv-score{text-align:right;flex:0 0 auto}
  .tv-blend{font-family:var(--mono);font-size:26px;font-weight:600;letter-spacing:-.02em;line-height:1}
  .tv-rank{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-top:4px}
  .watch-btn{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;
    margin-top:14px;padding:11px;border:1px solid var(--line);border-radius:9px;
    background:var(--card);color:var(--mid);font-size:13.5px;font-weight:500;cursor:pointer}
  .watch-btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
  .watch-btn svg{width:16px;height:16px}

  .bet{margin-top:14px;padding:11px 13px;background:var(--sunk);border-radius:9px;
    font-size:13px;line-height:1.5;color:var(--ink)}
  .bet b{display:block;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--muted);font-weight:500;margin-bottom:4px}

  .comp{display:grid;gap:5px}
  .comp .r{display:grid;grid-template-columns:1fr 42px;gap:8px;align-items:center;font-size:12px}
  .comp .bar{position:relative;height:17px;background:var(--sunk);border-radius:3px;overflow:hidden}
  .comp .fill{position:absolute;inset:0 auto 0 0;background:var(--accent);opacity:.28}
  .comp .t{position:relative;padding:0 6px;line-height:17px;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis}
  .comp .w{font-family:var(--mono);font-size:11px;color:var(--mid);text-align:right}
  .comp-cols{display:grid;gap:14px}
  @media (min-width:560px){.comp-cols{grid-template-columns:1fr 1fr}}

  figure{margin:18px 0 0}
  figcaption{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
    font-weight:500;margin-bottom:8px;display:flex;flex-wrap:wrap;gap:2px 12px;
    justify-content:space-between;align-items:baseline}
  .chart{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:10px 8px 8px;
    position:relative;touch-action:pan-y}
  .chart svg{display:block;width:100%}
  .range{display:flex;align-items:center;gap:8px;margin-top:9px}
  .range > span{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--muted);font-weight:500}
  .range .seg{flex:1}
  .range .seg button{flex:1;font-family:var(--mono);font-size:11.5px;padding:6px 4px}
  .range .seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
  .hint{font-size:10.5px;color:var(--muted);letter-spacing:0;text-transform:none;
    font-weight:400;white-space:nowrap}

  .tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);
    border-radius:6px;padding:5px 8px;font-size:11px;white-space:nowrap;opacity:0;
    transition:opacity .1s;z-index:2}
  .tip .d{font-family:var(--mono);opacity:.7;font-size:10px}
  .tip .v{font-family:var(--mono);font-weight:600}
  .legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:9px;font-size:11px;color:var(--mid)}
  .legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;
    vertical-align:-1px;border:1px solid var(--line)}
  .legend .hatched{background:var(--sunk);position:relative;overflow:hidden}

  .lbl{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
    font-weight:500;margin:18px 0 6px}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:0 16px}
  .kv{display:flex;justify-content:space-between;gap:8px;align-items:baseline;
    padding:6px 0;border-bottom:1px solid var(--line);font-size:12.5px}
  .kv .k{color:var(--muted)}
  .kv .v{font-family:var(--mono);font-size:12.5px;font-weight:500}
  .tags{display:flex;flex-wrap:wrap;gap:5px}
  .tag{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:4px 8px;
    font-size:12px;cursor:pointer}
  .tag b{font-family:var(--mono);font-weight:500;color:var(--mid);margin-left:4px}
  .tag.self{border-color:var(--ink);cursor:default}
  .tag.self .t{font-weight:700}
  .note{color:var(--mid);font-size:11.5px;line-height:1.5;margin-top:8px}

  /* ---- groups ---- */
  .intro{color:var(--mid);font-size:12.5px;line-height:1.55;padding:12px 0 14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:12px;margin-bottom:6px}
  .card h3{margin:0;font-family:var(--disp);font-size:13px;font-weight:600;letter-spacing:-.01em;
    display:flex;justify-content:space-between;align-items:baseline;gap:10px}
  .card h3 .rho{font-family:var(--mono);font-size:11px;font-weight:500;color:var(--muted)}
  .members{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
  .dupe{display:flex;justify-content:space-between;gap:10px;padding:6px 0;
    border-bottom:1px solid var(--line);font-size:12.5px}
  .dupe:last-child{border-bottom:0}
  .dupe .p{font-family:var(--disp);font-weight:600}
  .dupe .v{font-family:var(--mono);font-size:12px;color:var(--mid)}
  .empty{color:var(--muted);text-align:center;padding:34px 0;font-size:13px;line-height:1.6}

  footer{color:var(--muted);font-size:11px;line-height:1.65;padding:20px 0 0;
    border-top:1px solid var(--line);margin-top:20px}
  footer b{color:var(--mid);font-weight:500}
  footer .mono{font-family:var(--mono)}
</style>

<div class="wrap">
  <div id="main">
    <header>
      <div class="eyebrow" id="eyebrow"></div>
      <h1>Cross-Asset Momentum</h1>
      <div class="asof" id="asof"></div>
      <div class="tally" id="tally"></div>
      <div class="caveat" id="caveat"></div>
    </header>

    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="t-rank" aria-selected="true" aria-controls="view-rank">Ranking</button>
      <button class="tab" role="tab" id="t-group" aria-selected="false" aria-controls="view-group">Same-bet groups</button>
    </div>

    <section id="view-rank" role="tabpanel" aria-labelledby="t-rank">
      <div class="config" id="config"></div>
      <div class="controls">
        <input type="search" id="q" placeholder="Search ticker, name, bet or group" autocomplete="off" aria-label="Search">
        <div class="chips" id="chips"></div>
      </div>
      <ol id="list"></ol>
    </section>

    <section id="view-group" role="tabpanel" aria-labelledby="t-group" hidden></section>

    <footer id="foot"></footer>
  </div>

  <div id="ticker" hidden></div>
</div>

<script id="payload" type="application/json">/*__DATA__*/null</script>
<script>
(function(){
"use strict";
var DATA = JSON.parse(document.getElementById('payload').textContent);
var M = DATA.meta, ROWS = DATA.rows, S = DATA.series, A = S.anchors;
var byTicker = {}; ROWS.forEach(function(r){ byTicker[r.ticker] = r; });
var $ = function(s){ return document.querySelector(s); };

function esc(s){ return String(s).replace(/[&<>"]/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function pct(x){ return (x >= 0 ? '+' : '&minus;') + Math.abs(x*100).toFixed(1) + '%'; }
function sgn(x){ return (x >= 0 ? '+' : '&minus;') + Math.abs(x).toFixed(2); }
function fx(x, dp){ var t = x.toFixed(dp === undefined ? 2 : dp);
  return t.charAt(0) === '-' ? '&minus;' + t.slice(1) : t; }
function tone(x){ return x > 0.005 ? 'pos' : (x < -0.005 ? 'neg' : ''); }
function shortDate(iso){
  var p = iso.split('-'), mo = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return mo[+p[1]-1] + ' ' + (+p[2]) + ' ' + p[0].slice(2);
}
var STAR = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5l2.6 5.6 6 .8-4.4 4.2 1.1 6.1L12 17.3 6.7 20.2l1.1-6.1L3.4 9.9l6-.8z" '
  + 'fill="var(--fill,none)" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>';

/* ---------- ranking configuration ----------
   measure: 'zv' = z of (return / realized vol), 'zr' = z of the raw return.
   wins:    which of the 12-1 / 9-1 / 6-1 windows count, at equal weight.

   Both measures are z-scored per window in build.py, and only z-scores are ever
   averaged here. That is what makes an equal-weighted blend actually equal: a
   raw 12-1 return is mechanically larger than a raw 6-1 return, so averaging
   the raw numbers would hand the longest window the loudest vote. With one
   window selected the z-score is a monotone transform of the underlying value,
   so the order is exactly the raw order. */
var WINS = ['12', '9', '6'];
var WLBL = {'12': '12&ndash;1', '9': '9&ndash;1', '6': '6&ndash;1'};
var measure = M.default_measure, wins = M.default_windows.slice();
try {
  var saved = JSON.parse(localStorage.getItem('cam.config') || 'null');
  if (saved && (saved.measure === 'zv' || saved.measure === 'zr')
      && Array.isArray(saved.wins)){
    var w = saved.wins.filter(function(x){ return WINS.indexOf(x) > -1; });
    if (w.length){ measure = saved.measure; wins = w; }
  }
} catch (e) { /* unreadable storage just means the defaults stand */ }
function saveConfig(){
  try { localStorage.setItem('cam.config', JSON.stringify({measure: measure, wins: wins})); }
  catch (e) {}
}
function orderedWins(){
  return WINS.filter(function(w){ return wins.indexOf(w) > -1; });
}
function score(r){
  var ws = orderedWins(), t = 0;
  for (var i = 0; i < ws.length; i++) { t += r.m[ws[i]][measure]; }
  return t / ws.length;
}
/* Ranks are a function of the current configuration, so they are recomputed
   rather than read off the file. RANKED is the whole universe in current order;
   RANK maps ticker -> its place in it. */
var RANKED = [], RANK = {};
function reRank(){
  RANKED = ROWS.slice().sort(function(a, b){
    var d = score(b) - score(a);
    return d || (a.ticker < b.ticker ? -1 : 1);
  });
  RANK = {};
  RANKED.forEach(function(r, i){ RANK[r.ticker] = i + 1; });
}

/* ---------- watchlist: per-viewer, private, never leaves the browser ---------- */
var WATCH = (function(){
  try { return new Set(JSON.parse(localStorage.getItem('cam.watchlist') || '[]')); }
  catch (e) { return new Set(); }
})();
function saveWatch(){
  try { localStorage.setItem('cam.watchlist', JSON.stringify(Array.from(WATCH))); }
  catch (e) { /* private mode or blocked storage: the session still works */ }
}
function toggleWatch(t){
  if (WATCH.has(t)) { WATCH.delete(t); } else { WATCH.add(t); }
  saveWatch(); paintWatchCount();
}
function paintWatchCount(){
  var n = WATCH.size;
  var chip = $('#chip-watch');
  if (chip){
    chip.querySelector('.n').textContent = n;
    if (!n && onlyWatch){ onlyWatch = false; syncChips(); }
  }
}

/* ---------- masthead ---------- */
$('#asof').innerHTML = 'Through <b>' + esc(M.last_session) + '</b> &middot; '
  + M.ranked + ' of ' + M.universe_size + ' instruments ranked';
[['ranked', M.ranked], ['756d corr', M.correlation_eligible],
 ['groups', DATA.clusters.length], ['dupe pairs', DATA.duplicates.length]]
  .forEach(function(p){
    var d = document.createElement('div');
    d.innerHTML = '<div class="v">' + p[1] + '</div><div class="k">' + p[0] + '</div>';
    $('#tally').appendChild(d);
  });
function paintCaveat(){
  /* Only the vol-adjusted measure has the collapsing-denominator problem, and
     which instruments it hits depends on the universe -- so find them rather
     than naming them in the source. Anything whose 12-1 realized vol rounds to
     a couple of basis points a day gets an enormous return/vol score without
     having produced an interesting return. */
  var el = $('#caveat');
  if (measure !== 'zv'){ el.hidden = true; return; }
  var flagged = RANKED.slice(0, 8).filter(function(r){ return r.m['12'].vol < 0.001; });
  if (!flagged.length){ el.hidden = true; return; }
  el.hidden = false;
  var names = flagged.map(function(r){ return r.ticker; });
  var list = names.length === 1 ? names[0]
    : names.slice(0, -1).join(', ') + ' and ' + names[names.length - 1];
  el.innerHTML = '<b>Read ' + (names.length === 1 ? 'the top row' : 'the top ' + names.length
      + ' rows') + ' with care.</b> ' + list + ' lead' + (names.length === 1 ? 's' : '')
    + ' on realized vol near 0.01%/day, not on return &mdash; '
    + '<span class="num">return &divide; vol</span> explodes when the denominator collapses. '
    + 'Switch the measure to <b>raw return</b> and '
    + (names.length === 1 ? 'it falls' : 'they fall')
    + ' back to where the return alone puts '
    + (names.length === 1 ? 'it' : 'them') + '.';
}

/* ---------- the chart ----------
   Zoom and pan live in index space: `view` is a window [lo, hi] over the
   session index, and every mark is positioned through x(), so the bands,
   rails, window dots and crosshair all ride the same transform for free.

   The SVG is built once and only its geometry attributes are rewritten per
   frame. Re-serialising the markup on every pointermove is what makes a chart
   like this feel sticky on a phone. */
var CH = null;
var MIN_SPAN = 20;   // never zoom past roughly a month of sessions on screen

/* Chart display ranges, in completed sessions. These are the time axis only --
   they are deliberately labelled in months so they never read as the 12-1 /
   9-1 / 6-1 momentum windows, which the rails and the ranking use. `all` is
   the whole shipped series, ~18 months. */
var RANGES = [
  {k: 'all', label: 'All', span: null},
  {k: '12m', label: '12M', span: 252},
  {k: '6m',  label: '6M',  span: 126},
  {k: '3m',  label: '3M',  span: 63}
];

function drawChart(r, keepView){
  var host = $('#chart'); if (!host) return;
  var s = S.data[r.ticker];
  /* clientWidth includes the host's padding, so using it as the viewBox width
     made the SVG letterbox itself and render ~4% small. Measure the content box
     so one viewBox unit is exactly one CSS pixel -- the pointer maths below
     depends on that. */
  var cs = getComputedStyle(host);
  var W = host.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  var H = 264;
  var padL = 6, padR = 36, padT = 14, padB = 80;
  var n = S.dates.length, plotW = W - padL - padR, plotH = H - padT - padB;
  var wins = orderedWins();
  var keep = keepView && CH && CH.ticker === r.ticker ? CH.view : null;

  function svgEl(tag, attrs){
    var e = document.createElementNS('http://www.w3.org/2000/svg', tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }

  var svg = svgEl('svg', {
    viewBox: '0 0 ' + W + ' ' + H, height: H, role: 'img',
    'aria-label': r.ticker + ' price rebased to 100 at the 12 minus 1 window start. '
      + wins.map(function(w){
          return w + ' minus 1 return ' + (r.m[w].ret * 100).toFixed(1) + ' percent'; }).join(', ')
      + '. Pinch to zoom the time axis, drag to pan.'
  });

  var defs = svgEl('defs', {});
  var pat = svgEl('pattern', {id: 'hatch', width: 5, height: 5,
    patternTransform: 'rotate(45)', patternUnits: 'userSpaceOnUse'});
  pat.appendChild(svgEl('line', {x1: 0, y1: 0, x2: 0, y2: 5,
    stroke: 'var(--hatch)', 'stroke-width': 1.1}));
  var clip = svgEl('clipPath', {id: 'plotclip'});
  clip.appendChild(svgEl('rect', {x: padL, y: 0, width: plotW, height: H}));
  defs.appendChild(pat); defs.appendChild(clip);
  svg.appendChild(defs);

  /* everything that moves under zoom lives in one clipped group, so panned
     content never spills over the y-axis labels in the right margin */
  var g = svgEl('g', {'clip-path': 'url(#plotclip)'});
  svg.appendChild(g);

  var bands = {};
  wins.forEach(function(w){                       // widest first: the nesting is the point
    bands[w] = svgEl('rect', {y: padT, height: plotH, fill: 'var(--band' + w + ')'});
    g.appendChild(bands[w]);
  });
  bands.skip = svgEl('rect', {y: padT, height: plotH, fill: 'url(#hatch)'});
  g.appendChild(bands.skip);

  /* the rebase line sits outside the clip: its x is fixed, only its y moves */
  var line100 = svgEl('line', {x1: padL, x2: W - padR, stroke: 'var(--muted)',
    'stroke-width': 1, 'stroke-dasharray': '2 3', opacity: '.65'});
  svg.appendChild(line100);
  function axisLabel(){
    return svgEl('text', {x: W - padR + 4, 'font-size': 9.5,
      'font-family': 'var(--mono)', fill: 'var(--muted)'});
  }
  var lbl100 = axisLabel(), lblHi = axisLabel(), lblLo = axisLabel();
  lbl100.textContent = '100';
  svg.appendChild(lbl100); svg.appendChild(lblHi); svg.appendChild(lblLo);

  var path = svgEl('path', {fill: 'none', stroke: 'var(--accent)', 'stroke-width': 2,
    'stroke-linejoin': 'round', 'stroke-linecap': 'round'});
  g.appendChild(path);

  var dots = {};
  wins.concat(['end']).forEach(function(k){
    dots[k] = svgEl('circle', {r: 4, fill: 'var(--accent)',
      stroke: 'var(--card)', 'stroke-width': 2});
    g.appendChild(dots[k]);
  });

  var cross = svgEl('line', {y1: padT, y2: H - padB, stroke: 'var(--ink)',
    'stroke-width': 1, opacity: 0});
  var cdot = svgEl('circle', {r: 3.5, fill: 'var(--accent)', stroke: 'var(--card)',
    'stroke-width': 2, opacity: 0});
  g.appendChild(cross); g.appendChild(cdot);

  function dateLabel(anchor){
    return svgEl('text', {y: H - padB + 12, 'font-size': 9.5, 'text-anchor': anchor,
      'font-family': 'var(--mono)', fill: 'var(--muted)'});
  }
  var dLoLbl = dateLabel('start'), dHiLbl = dateLabel('end');
  dLoLbl.setAttribute('x', padL); dHiLbl.setAttribute('x', W - padR);
  g.appendChild(dLoLbl); g.appendChild(dHiLbl);

  var rails = {};
  wins.forEach(function(w, row){
    var ya = H - padB + 32 + row * 18;   // clear of the date labels above
    var gr = svgEl('g', {});
    var bar = svgEl('line', {y1: ya, y2: ya, stroke: 'var(--muted)', 'stroke-width': 1});
    var capA = svgEl('line', {y1: ya - 3, y2: ya + 3, stroke: 'var(--muted)', 'stroke-width': 1});
    var capB = svgEl('line', {y1: ya - 3, y2: ya + 3, stroke: 'var(--muted)', 'stroke-width': 1});
    var txt = svgEl('text', {y: ya - 5, 'text-anchor': 'middle', 'font-size': 10,
      'font-family': 'var(--mono)', fill: 'var(--mid)'});
    txt.innerHTML = WLBL[w] + ' ' + pct(r.m[w].ret);
    gr.appendChild(bar); gr.appendChild(capA); gr.appendChild(capB); gr.appendChild(txt);
    g.appendChild(gr);
    rails[w] = {bar: bar, capA: capA, capB: capB, txt: txt};
  });

  host.innerHTML = '';
  host.appendChild(svg);
  var tip = document.createElement('div');
  tip.className = 'tip'; tip.id = 'tip';
  host.appendChild(tip);
  var skipLegend = $('#lg-skip');
  if (skipLegend) skipLegend.style.background =
    'repeating-linear-gradient(45deg,var(--hatch) 0 1px,transparent 1px 4px)';

  CH = {
    ticker: r.ticker, r: r, s: s, n: n, W: W, H: H,
    padL: padL, padR: padR, padT: padT, padB: padB, plotW: plotW, plotH: plotH,
    wins: wins, svg: svg, path: path, bands: bands, dots: dots, rails: rails,
    line100: line100, lbl100: lbl100, lblHi: lblHi, lblLo: lblLo,
    dLoLbl: dLoLbl, dHiLbl: dHiLbl, cross: cross, cdot: cdot,
    tip: tip, host: host,
    view: keep || {lo: 0, hi: n - 1},
    y: null, frame: 0
  };
  clampView();
  applyView();
  attachGestures();
  attachRange();
}

function setRange(key){
  var q = RANGES.filter(function(x){ return x.k === key; })[0];
  if (!q) return;
  var n = CH.n;
  CH.view = q.span === null
    ? {lo: 0, hi: n - 1}
    : {lo: n - 1 - q.span, hi: n - 1};   // presets anchor on the most recent session
  clampView(); hideCross(); applyView();
}

/* Which preset the current view corresponds to, if any. A pinch or a pan
   usually lands between presets, and then none is active. */
function activeRange(){
  var v = CH.view, n = CH.n, span = v.hi - v.lo;
  if (Math.abs(span - (n - 1)) < 1.5) return 'all';
  if (Math.abs(v.hi - (n - 1)) > 1.5) return null;   // not anchored to the latest session
  for (var i = 0; i < RANGES.length; i++){
    if (RANGES[i].span !== null && Math.abs(span - RANGES[i].span) < 1.5) return RANGES[i].k;
  }
  return null;
}

function paintRange(){
  var act = activeRange();
  var btns = document.querySelectorAll('#seg-range button');
  for (var i = 0; i < btns.length; i++){
    btns[i].setAttribute('aria-pressed', String(btns[i].dataset.r === act));
  }
}

function attachRange(){
  var seg = $('#seg-range'); if (!seg) return;
  seg.addEventListener('click', function(ev){
    var b = ev.target.closest('button'); if (!b) return;
    setRange(b.dataset.r);
  });
  paintRange();
}

function clampView(){
  var v = CH.view, n = CH.n;
  var span = Math.min(Math.max(v.hi - v.lo, MIN_SPAN), n - 1);
  var mid = (v.lo + v.hi) / 2;
  v.lo = mid - span / 2; v.hi = mid + span / 2;
  if (v.lo < 0){ v.hi -= v.lo; v.lo = 0; }
  if (v.hi > n - 1){ v.lo -= (v.hi - (n - 1)); v.hi = n - 1; }
  if (v.lo < 0) v.lo = 0;
}

function isZoomed(){ return CH && (CH.view.hi - CH.view.lo) < CH.n - 1 - 0.5; }
function cx(i){ return CH.padL + ((i - CH.view.lo) / (CH.view.hi - CH.view.lo)) * CH.plotW; }

/* Rewrites geometry only -- no markup is re-serialised here. */
function applyView(){
  var s = CH.s, v = CH.view, n = CH.n;

  /* rescale y to what is actually on screen, so zooming into a quiet stretch
     opens it up instead of showing a flat line against the full-range axis */
  var iLo = Math.max(s.o, Math.floor(v.lo)), iHi = Math.min(n - 1, Math.ceil(v.hi));
  var dLo = Infinity, dHi = -Infinity;
  for (var i = iLo; i <= iHi; i++){
    var p = s.p[i - s.o];
    if (p === undefined) continue;
    if (p < dLo) dLo = p; if (p > dHi) dHi = p;
  }
  if (!isFinite(dLo)){ dLo = 1; dHi = 1; }
  var pad = (dHi - dLo) * 0.10 || 0.02;
  var lo = dLo - pad, hi = dHi + pad;
  var y = CH.y = function(val){
    return CH.padT + (1 - (val - lo) / (hi - lo)) * CH.plotH; };

  /* only path the visible slice (plus a point either side so the line enters
     and leaves the frame cleanly) */
  var pLo = Math.max(s.o, Math.floor(v.lo) - 1), pHi = Math.min(n - 1, Math.ceil(v.hi) + 1);
  var d = '';
  for (var k = pLo; k <= pHi; k++){
    d += (k === pLo ? 'M' : 'L') + cx(k).toFixed(1) + ' ' + y(s.p[k - s.o]).toFixed(1) + ' ';
  }
  CH.path.setAttribute('d', d);

  function setBand(rect, a, b){
    var xa = cx(a), xb = cx(b);
    rect.setAttribute('x', xa.toFixed(1));
    rect.setAttribute('width', Math.max(0, xb - xa).toFixed(1));
  }
  CH.wins.forEach(function(w){ setBand(CH.bands[w], A['start' + w], A.end); });
  setBand(CH.bands.skip, A.end, A.last);

  CH.wins.concat(['end']).forEach(function(k){
    var idx = k === 'end' ? A.end : A['start' + k];
    CH.dots[k].setAttribute('cx', cx(idx).toFixed(1));
    CH.dots[k].setAttribute('cy', y(s.p[idx - s.o]).toFixed(1));
  });

  /* the rebase line only means anything while 100 is on screen; zooming into a
     stretch that never trades near the entry price must not park it in the
     margin under the date labels */
  var y100 = y(1), on100 = y100 >= CH.padT && y100 <= CH.padT + CH.plotH;
  CH.line100.setAttribute('opacity', on100 ? '.65' : '0');
  CH.lbl100.setAttribute('opacity', on100 ? '1' : '0');
  CH.line100.setAttribute('y1', y100.toFixed(1));
  CH.line100.setAttribute('y2', y100.toFixed(1));
  CH.lbl100.setAttribute('y', (y100 + 3.5).toFixed(1));
  CH.lblHi.setAttribute('y', (y(dHi) + 3.5).toFixed(1));
  CH.lblHi.textContent = (dHi * 100).toFixed(0);
  CH.lblLo.setAttribute('y', (y(dLo) + 3.5).toFixed(1));
  CH.lblLo.textContent = (dLo * 100).toFixed(0);

  CH.dLoLbl.textContent = shortDate(S.dates[Math.max(s.o, Math.round(v.lo))]);
  CH.dHiLbl.textContent = shortDate(S.dates[Math.min(n - 1, Math.round(v.hi))]);

  CH.wins.forEach(function(w){
    var q = CH.rails[w], xa = cx(A['start' + w]), xb = cx(A.end);
    q.bar.setAttribute('x1', xa.toFixed(1)); q.bar.setAttribute('x2', xb.toFixed(1));
    q.capA.setAttribute('x1', xa.toFixed(1)); q.capA.setAttribute('x2', xa.toFixed(1));
    q.capB.setAttribute('x1', xb.toFixed(1)); q.capB.setAttribute('x2', xb.toFixed(1));
    /* centre the label over the part of the rail that is actually on screen.
       Zoomed in, a window usually starts off the left edge, and centring on the
       true midpoint would jam the label into the corner under the date label. */
    var visA = Math.max(xa, CH.padL), visB = Math.min(xb, CH.W - CH.padR);
    var mid = visB > visA ? (visA + visB) / 2 : (xa + xb) / 2;
    mid = Math.min(Math.max(mid, CH.padL + 34), CH.W - CH.padR - 34);
    q.txt.setAttribute('x', mid.toFixed(1));
  });

  paintRange();
}

function scheduleView(){
  if (CH.frame) return;
  CH.frame = requestAnimationFrame(function(){ CH.frame = 0; applyView(); });
}

function zoomAt(factor, anchorPx){
  var v = CH.view;
  var frac = Math.min(Math.max((anchorPx - CH.padL) / CH.plotW, 0), 1);
  var anchorIdx = v.lo + frac * (v.hi - v.lo);
  var span = Math.min(Math.max((v.hi - v.lo) / factor, MIN_SPAN), CH.n - 1);
  v.lo = anchorIdx - frac * span;
  v.hi = v.lo + span;
  clampView();
}

function panBy(dxPx){
  var v = CH.view, perPx = (v.hi - v.lo) / CH.plotW;
  v.lo -= dxPx * perPx; v.hi -= dxPx * perPx;
  clampView();
}

function showCross(px){
  var s = CH.s, v = CH.view;
  var i = Math.round(v.lo + ((px - CH.padL) / CH.plotW) * (v.hi - v.lo));
  i = Math.max(Math.max(s.o, Math.ceil(v.lo)), Math.min(Math.min(CH.n - 1, Math.floor(v.hi)), i));
  var val = s.p[i - s.o];
  if (val === undefined) return;
  var X = cx(i);
  CH.cross.setAttribute('x1', X); CH.cross.setAttribute('x2', X);
  CH.cross.setAttribute('opacity', '.28');
  CH.cdot.setAttribute('cx', X); CH.cdot.setAttribute('cy', CH.y(val));
  CH.cdot.setAttribute('opacity', '1');
  CH.tip.innerHTML = '<span class="d">' + shortDate(S.dates[i]) + '</span> &nbsp;'
    + '<span class="v">' + (val * 100).toFixed(1) + '</span>';
  CH.tip.style.opacity = '1';
  var box = CH.svg.getBoundingClientRect(), scale = box.width / CH.W;
  var tx = X * scale, tw = CH.tip.offsetWidth;
  CH.tip.style.left = Math.max(4, Math.min(box.width - tw - 4, tx - tw / 2)) + 'px';
  CH.tip.style.top = '0px';
}

function hideCross(){
  CH.cross.setAttribute('opacity', '0');
  CH.cdot.setAttribute('opacity', '0');
  CH.tip.style.opacity = '0';
}

function attachGestures(){
  var host = CH.host, pts = new Map();
  var pinch = null, panning = false, moved = 0, lastTap = 0;

  function toLocal(ev){
    var box = CH.svg.getBoundingClientRect();
    return (ev.clientX - box.left) * (CH.W / box.width);
  }

  host.addEventListener('pointerdown', function(ev){
    pts.set(ev.pointerId, {x: ev.clientX, local: toLocal(ev)});
    if (pts.size === 1){
      moved = 0; panning = false;
      if (ev.pointerType !== 'touch') showCross(toLocal(ev));
    } else if (pts.size === 2){
      hideCross();
      var a = Array.from(pts.values());
      pinch = {spread: Math.abs(a[0].x - a[1].x) || 1,
               span: CH.view.hi - CH.view.lo,
               mid: (a[0].local + a[1].local) / 2};
    }
    try { host.setPointerCapture(ev.pointerId); } catch (e) {}
  });

  host.addEventListener('pointermove', function(ev){
    var p = pts.get(ev.pointerId); if (!p) return;
    var prevX = p.x;
    p.x = ev.clientX; p.local = toLocal(ev);

    if (pts.size >= 2 && pinch){
      var a = Array.from(pts.values());
      var spread = Math.abs(a[0].x - a[1].x) || 1;
      var mid = (a[0].local + a[1].local) / 2;
      /* zoom about the pinch midpoint, and let that midpoint drag the view too,
         so two fingers zoom and pan in one continuous motion */
      var span = Math.min(Math.max(pinch.span * (pinch.spread / spread), MIN_SPAN), CH.n - 1);
      var frac = Math.min(Math.max((mid - CH.padL) / CH.plotW, 0), 1);
      var anchorIdx = CH.view.lo + ((pinch.mid - CH.padL) / CH.plotW) * (CH.view.hi - CH.view.lo);
      CH.view.lo = anchorIdx - frac * span;
      CH.view.hi = CH.view.lo + span;
      clampView();
      pinch.spread = spread; pinch.span = CH.view.hi - CH.view.lo; pinch.mid = mid;
      scheduleView();
      return;
    }

    moved += Math.abs(ev.clientX - prevX);
    if (isZoomed()){
      /* one finger pans a zoomed chart; the crosshair would fight the drag, so
         it stays hidden until the finger stops moving */
      if (!panning && moved > 3){ panning = true; hideCross(); }
      if (panning){
        var box = CH.svg.getBoundingClientRect();
        panBy((ev.clientX - prevX) * (CH.W / box.width));
        scheduleView();
        return;
      }
    }
    showCross(toLocal(ev));
  });

  function release(ev){
    var wasPanning = panning;
    pts.delete(ev.pointerId);
    if (pts.size < 2) pinch = null;
    if (pts.size === 0){
      panning = false;
      if (!wasPanning && moved < 4 && ev.type === 'pointerup'){
        var now = Date.now();
        if (now - lastTap < 320){ CH.view = {lo: 0, hi: CH.n - 1}; hideCross(); applyView(); }
        else if (ev.pointerType === 'touch') showCross(toLocal(ev));
        lastTap = now;
      }
    }
  }
  host.addEventListener('pointerup', release);
  host.addEventListener('pointercancel', function(ev){ hideCross(); release(ev); });
  host.addEventListener('pointerleave', function(ev){
    if (ev.pointerType !== 'touch' && !pts.size) hideCross(); });

  /* touch-action:pan-y lets the page scroll vertically off this element, but a
     two-finger gesture must not scroll or page-zoom -- that needs a
     non-passive listener */
  host.addEventListener('touchmove', function(ev){
    if (ev.touches.length >= 2) ev.preventDefault();
  }, {passive: false});

  host.addEventListener('wheel', function(ev){
    ev.preventDefault();
    zoomAt(ev.deltaY < 0 ? 1.18 : 1 / 1.18, toLocal(ev));
    scheduleView();
  }, {passive: false});

}
var redrawTimer;
window.addEventListener('resize', function(){
  if ($('#ticker').hidden) return;
  clearTimeout(redrawTimer);
  redrawTimer = setTimeout(function(){
    var t = $('.tv-tk'); if (t) drawChart(byTicker[t.textContent], true);
  }, 120);
});

/* ---------- groups ---------- */
function renderGroups(){
$('#view-group').innerHTML =
  '<div class="intro">Instruments whose average-linkage correlation holds at or above '
    + '<span class="num">' + M.cluster_threshold + '</span> across '
    + '<span class="num">' + M.correlation_returns + '</span> daily returns. '
    + 'Pearson on raw returns, sign preserved, nothing residualized. '
    + 'Nothing here is deleted or merged &mdash; the groups exist to be looked at.</div>'
  + DATA.clusters.map(function(c){
      return '<div class="card"><h3>' + c.size + ' instruments'
        + '<span class="rho">avg &rho; ' + c.avg_corr.toFixed(3)
        + ' &middot; min ' + c.min_corr.toFixed(3) + '</span></h3>'
        + '<div class="members">' + c.members.map(function(t){
            return '<button class="tag" data-go="' + t + '"><span class="t">' + t
              + '</span><b>#' + RANK[t] + '</b></button>';
          }).join('') + '</div></div>';
    }).join('')
  + '<div class="card"><h3>Near-duplicate pairs<span class="rho">&rho; &ge; '
    + M.duplicate_threshold + ' &middot; ' + DATA.duplicates.length + ' pairs</span></h3>'
    + '<div style="margin-top:8px">' + DATA.duplicates.map(function(d){
        return '<div class="dupe"><span class="p">' + d.a + ' &nbsp;/&nbsp; ' + d.b
          + '</span><span class="v">' + d.corr.toFixed(4) + '</span></div>';
      }).join('') + '</div></div>';
}
$('#view-group').addEventListener('click', function(e){
  var g = e.target.closest('[data-go]'); if (g) showTicker(g.dataset.go);
});

/* ---------- footer ---------- */
$('#foot').innerHTML =
  '<b>Momentum.</b> A ' + WINS.join('/') + '&ndash;1 window is the return from that many months '
  + 'back to ' + M.lag + ' sessions back &mdash; '
  + WINS.map(function(w){ return M.windows[w] + '&rarr;' + M.lag; }).join(', ')
  + ' sessions. The vol-adjusted measure divides that return by the realized daily volatility of '
  + 'the same window; the raw measure uses the return alone. Either way each window is z-scored '
  + 'across the ' + M.ranked + ' ranked instruments and the selected windows are averaged at equal '
  + 'weight &mdash; averaging z-scores rather than the underlying numbers is what stops a longer '
  + 'window outvoting a shorter one purely because its returns are bigger. Returns and vols are '
  + 'left un-annualized; the cross-sectional z-score is scale-invariant. Every instrument clears '
  + 'the ' + M.min_rank_sessions + '-session bar for the longest window, so the population is the '
  + 'same whichever windows you pick. Every category ranks together; category is display metadata '
  + 'only.<br><br>'
  + '<b>Correlation.</b> Pearson on <span class="num">' + M.correlation_returns
  + '</span> raw daily returns spanning <span class="num">' + M.correlation_sessions
  + '</span> aligned sessions (<span class="mono">' + esc(M.correlation_window[0]) + '</span> to '
  + '<span class="mono">' + esc(M.correlation_window[1]) + '</span>). An instrument needs a price on '
  + 'every one of those sessions to qualify; the window is never shortened to admit newer products. '
  + 'A dot beside a ticker marks one that ranks but cannot be correlated.<br><br>'
  + '<b>Prices.</b> ' + esc(M.price_source) + '. Total-return series, so distributions are not '
  + 'penalised. Nothing imputed, nothing forward-filled. Instruments stale in FMP, or under a '
  + '$' + (M.min_dollar_volume / 1e6).toFixed(0) + 'M median dollar-volume floor, are excluded '
  + '(<span class="num">' + M.excluded_count + '</span>). '
  + 'Prices pulled from FMP <span class="mono">' + esc(M.prices_fetched_at) + '</span>; '
  + 'the ranking is a pure function of that pull, so the same prices always give the same '
  + 'page.<br><br>'
  + '<b>Watchlist.</b> Stored in this browser only &mdash; it never leaves the device and is '
  + 'not shared with anyone who opens this page. Not investment advice.';

reRank(); paintConfig(); paintCaveat(); renderGroups(); syncChips();
})();
</script>
